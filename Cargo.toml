[package]
name = "sweep"
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false
description = "Inspect shell installers before running them"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
futures-util = "0.3.34"
hex = "0.4.3"
jsonc-parser = { version = "0.34.0", features = ["serde"] }
palette = "0.7.7"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["brotli", "deflate", "gzip", "json", "stream", "zstd"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
tempfile = "3.27.0"
terminal-colorsaurus = "1.0.3"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = "0.7.19"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
url = "2.5.8"
uuid = { version = "1.27.0", features = ["v4"] }
